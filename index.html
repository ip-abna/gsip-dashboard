<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/abna-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Relatório Nacional de RP/IP da ABNA - Associação Brasileira de Narcóticos Anônimos" />
  <meta name="keywords"
    content="ABNA, Narcóticos Anônimos, RP, IP, Relações Públicas, Informação Pública, Dashboard, Campanhas" />
  <meta name="author" content="ABNA - Associação Brasileira de Narcóticos Anônimos" />
  <!-- Combina com o masthead (mesma cor da arte do banner) -->
  <meta name="theme-color" content="#373374" />

  <!-- Open Graph / Facebook / WhatsApp.
       og:image precisa ser URL absoluta: scrapers não resolvem caminho relativo.
       Regenerar a imagem com: node scripts/generate-og.mjs -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ABNA - Narcóticos Anônimos" />
  <meta property="og:url" content="https://ip-abna.github.io/gsip-dashboard/" />
  <meta property="og:title" content="Relatório Nacional de RP/IP" />
  <meta property="og:description"
    content="Relatório Nacional de RP/IP da ABNA - Associação Brasileira de Narcóticos Anônimos" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:image" content="https://ip-abna.github.io/gsip-dashboard/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt"
    content="Relatório Nacional de Informação ao Público - Painel de Dados Nacionais da ABNA" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Relatório Nacional de RP/IP" />
  <meta name="twitter:description"
    content="Relatório Nacional de RP/IP da ABNA - Associação Brasileira de Narcóticos Anônimos" />
  <meta name="twitter:image" content="https://ip-abna.github.io/gsip-dashboard/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/abna-logo.svg" />

  <title>Relatório Nacional de RP/IP</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
