name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Optional deploy: runs only when Cloudflare is configured. Set the
# CLOUDFLARE_API_TOKEN (+ CLOUDFLARE_ACCOUNT_ID) repo secrets to activate;
# leave them unset and this workflow skips itself — GitHub Pages (deploy-github-pages.yml)
# remains the default deployment.
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # Secrets can't be read in a job-level `if`, so a guard job exposes
      # "is Cloudflare configured" as an output the deploy job can gate on.
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping Cloudflare Pages deploy."
          fi

  build_and_deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same VITE_ secrets as the GitHub Pages deploy. --base=/ overrides the
      # /abna-dashboard/ base in vite.config.ts (a GitHub Pages project-path
      # requirement); Cloudflare Pages serves from the domain root.
      - name: Build
        run: bun run build -- --base=/
        env:
          NODE_ENV: production
          VITE_GOOGLE_SHEETS_API_KEY: ${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}
          VITE_GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.VITE_GOOGLE_SHEETS_SPREADSHEET_ID }}
          VITE_GOOGLE_SHEETS_RANGE: ${{ secrets.VITE_GOOGLE_SHEETS_RANGE }}

      # The Pages project must already exist (wrangler pages project create <name>).
      # Override the project name with the CLOUDFLARE_PAGES_PROJECT repo variable.
      # wrangler is bounded to its v4 major so a surprise breaking release can't
      # take down the deploy without a code change.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'abna-dashboard' }} --branch=main
