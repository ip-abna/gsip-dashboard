name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Optional deploy: runs only when Cloudflare is configured. Set the
# CLOUDFLARE_API_TOKEN (+ CLOUDFLARE_ACCOUNT_ID) repo secrets to activate;
# leave them unset and this workflow skips itself — GitHub Pages (deploy-github-pages.yml)
# remains the default deployment.
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # Secrets can't be read in a job-level `if`, so a guard job exposes
      # "is Cloudflare configured" as an output the deploy job can gate on.
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping Cloudflare Pages deploy."
          fi

  build_and_deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same build as the GitHub Pages deploy: the relative base in vite.config.ts
      # serves from the domain root as-is, and the Google Sheets settings are
      # defaults in src/services/GoogleSheetsService.ts.
      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      # The Pages project must already exist (wrangler pages project create <name>).
      # Override the project name with the CLOUDFLARE_PAGES_PROJECT repo variable.
      # wrangler is bounded to its v4 major so a surprise breaking release can't
      # take down the deploy without a code change.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'abna-dashboard' }} --branch=main
